[project]
name = "deepbattleship"
version = "0.1.0"
description = "Experiment of DL based AI for the traditional battleship game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
    "tensorboard>=2.20",
    "torch>=2.8",
    "tqdm>=4.67",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
